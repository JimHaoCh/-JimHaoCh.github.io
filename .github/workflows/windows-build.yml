name: Build and test Windows installer
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Test and build
        shell: pwsh
        run: ./build/build_arch.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: builds/${{ matrix.arch }}/NE501_Multi_Pump_Controller/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ matrix.arch }}
          path: builds/ui-preview-${{ matrix.arch }}.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-${{ matrix.arch }}
          path: |
            builds/ui-shots-source/*.png
            builds/ui-shots-${{ matrix.arch }}/*.png
          if-no-files-found: ignore
          retention-days: 30

  ui-review:
    needs: application
    if: always()
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ui-shots-*
          path: screenshots
      - name: Record review screenshots as Git blobs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem screenshots -Recurse -Filter '*.png' | Where-Object { $_.Name -match 'workflow-step[124]-(zh_TW|en)-100.png$|workflow-timeline-(zh_TW|en)-100.png$|workflow-(flow-step[124]|manual-step3)-(zh_TW|en)-100.png$|station-(zh_TW|en)-(100|130).png$|station-priming-zh_TW-100.png$|workflow-(demo-status|real-preview)-zh_TW-100.png$' } | Select-Object -First 60
          foreach ($file in $files) {
            $payload = @{mime_type='image/png';filename=$file.Name;data=[Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))} | ConvertTo-Json -Compress
            $body = @{encoding='utf-8';content=$payload} | ConvertTo-Json -Compress
            $inputFile = Join-Path $env:TEMP 'ui-blob.json'
            [IO.File]::WriteAllText($inputFile, $body)
            $sha = gh api --method POST 'repos/${{ github.repository }}/git/blobs' --input $inputFile --jq '.sha'
            if ($LASTEXITCODE -ne 0) { throw 'UI review blob upload failed.' }
            Write-Host ("UI_IMAGE_JSON " + $file.FullName.Replace('\','/') + " " + $sha)
          }

  installer:
    needs: application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-x64
          path: builds/x64/NE501_Multi_Pump_Controller
      - uses: actions/download-artifact@v4
        with:
          name: app-arm64
          path: builds/arm64/NE501_Multi_Pump_Controller
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' } }
      - name: Assemble installer
        shell: pwsh
        run: ./build/assemble_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release/NE501_UI_v1.5.2_Setup.exe
          if-no-files-found: error
          retention-days: 7

  install-test:
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release
      - name: Test installer and installed application
        shell: pwsh
        run: ./build/test_installer.ps1 -Arch '${{ matrix.arch }}' -Installer 'release/NE501_UI_v1.5.2_Setup.exe'

  verified-artifact:
    needs: install-test
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ui-preview-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ui-shots-x64
          path: release/ui-shots
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $f = 'release/NE501_UI_v1.5.2_Setup.exe'
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  NE501_UI_v1.5.2_Setup.exe" | Set-Content -Encoding ascii 'release/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: NE501-installer-verified
          path: |
            release/NE501_UI_v1.5.2_Setup.exe
            release/SHA256.txt
            release/ui-preview-x64.png
            release/ui-shots/ui-shots-source/manual-zh_TW-1280-100.png
            release/ui-shots/ui-shots-source/manual-en-1280-100.png
            release/ui-shots/ui-shots-source/timeline-zh_TW-1280-100.png
            release/ui-shots/ui-shots-source/timeline-en-1280-100.png
            release/ui-shots/ui-shots-source/workflow-step1-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-step2-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-step2-en-100.png
            release/ui-shots/ui-shots-source/station-zh_TW-100.png
            release/ui-shots/ui-shots-source/station-en-100.png
            release/ui-shots/ui-shots-source/station-priming-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-timeline-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-timeline-en-100.png
            release/ui-shots/ui-shots-source/workflow-flow-step4-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-flow-step4-en-100.png
            release/ui-shots/ui-shots-source/workflow-manual-step3-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-demo-status-zh_TW-100.png
            release/ui-shots/ui-shots-source/workflow-real-preview-zh_TW-100.png
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    needs: [verified-artifact, ui-review]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ne501-v1.5.2'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-verified
          path: release
      - name: Publish a clearly marked candidate release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ne501-v1.5.2-build-${{ github.run_number }}'
          gh release create $tag --target '${{ github.sha }}' --prerelease --title 'NE-501 v1.5.2 Simplified Preparation and Mouse Input' --notes-file TIMELINE_PREVIEW_README_zh.txt 'release/NE501_UI_v1.5.2_Setup.exe' 'release/SHA256.txt' 'release/ui-preview-x64.png' 'DISCLAIMER.txt' 'REFERENCES.md' 'TIMELINE_PREVIEW_README_zh.txt' 'UI_REVIEW_2026-11-06.md' 'UI_REVIEW_v1.5.2.md' 'BILINGUAL_MANUAL_UI_v1.5.2.md' 'BILINGUAL_UI_QUICK_START_en.txt' 'release/ui-shots/ui-shots-source/manual-zh_TW-1280-100.png' 'release/ui-shots/ui-shots-source/manual-en-1280-100.png' 'release/ui-shots/ui-shots-source/timeline-zh_TW-1280-100.png' 'release/ui-shots/ui-shots-source/timeline-en-1280-100.png' 'release/ui-shots/ui-shots-source/workflow-step1-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-step2-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-step2-en-100.png' 'release/ui-shots/ui-shots-source/station-zh_TW-100.png' 'release/ui-shots/ui-shots-source/station-en-100.png' 'release/ui-shots/ui-shots-source/station-priming-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-timeline-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-timeline-en-100.png' 'release/ui-shots/ui-shots-source/workflow-flow-step4-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-flow-step4-en-100.png' 'release/ui-shots/ui-shots-source/workflow-manual-step3-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-demo-status-zh_TW-100.png' 'release/ui-shots/ui-shots-source/workflow-real-preview-zh_TW-100.png'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed. The verified artifact remains available in this Actions run.' }
