name: Build and test Windows installer
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Test and build
        shell: pwsh
        run: ./build/build_arch.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: builds/${{ matrix.arch }}/NE501_Multi_Pump_Controller/
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-x64
          path: builds/x64/NE501_Multi_Pump_Controller
      - uses: actions/download-artifact@v4
        with:
          name: app-arm64
          path: builds/arm64/NE501_Multi_Pump_Controller
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' } }
      - name: Assemble installer
        shell: pwsh
        run: ./build/assemble_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release/NE501_Timeline_UI_Preview_Setup.exe
          if-no-files-found: error
          retention-days: 7

  install-test:
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release
      - name: Test installer and installed application
        shell: pwsh
        run: ./build/test_installer.ps1 -Arch '${{ matrix.arch }}' -Installer 'release/NE501_Timeline_UI_Preview_Setup.exe'

  verified-artifact:
    needs: install-test
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-candidate
          path: release
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $f = 'release/NE501_Timeline_UI_Preview_Setup.exe'
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  NE501_Timeline_UI_Preview_Setup.exe" | Set-Content -Encoding ascii 'release/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: NE501-installer-verified
          path: |
            release/NE501_Timeline_UI_Preview_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    needs: verified-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/ne501-timeline-ui-preview-20261106'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NE501-installer-verified
          path: release
      - name: Publish a clearly marked candidate release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ne501-timeline-ui-preview-${{ github.run_number }}'
          gh release create $tag --target '${{ github.sha }}' --prerelease --title 'NE-501 Timeline UI Preview (Simulation Only)' --notes-file TIMELINE_PREVIEW_README_zh.txt 'release/NE501_Timeline_UI_Preview_Setup.exe' 'release/SHA256.txt' 'DISCLAIMER.txt' 'REFERENCES.md' 'TIMELINE_PREVIEW_README_zh.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed. The verified artifact remains available in this Actions run.' }
